[project]
name = "aur-packages-helper"
version = "0.1.0"
description = "为 aur-packages 项目提供应用版本、文件 hash 等信息的配套服务"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=4.0.0a6",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "tortoise-orm>=1.1.7",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "ty>=0.0.8",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

# 工具型项目（不构建/分发），声明非包模式，避免 uv 尝试构建
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 工具型项目（非包模式），显式把项目根加入 sys.path 以支持绝对导入 app.*
pythonpath = ["."]

[tool.ty]
# Ty 配置 - Astral 开发的快速 Python 类型检查器
# https://docs.astral.sh/ty/
# 运行命令：uv run ty check .

# 源代码配置
[tool.ty.src]
# 排除的文件和目录
exclude = [
    ".venv",
    "__pycache__",
    "*.pyc",
]

# 分析配置
[tool.ty.analysis]
# 尊重 type: ignore 注释
respect-type-ignore-comments = true

# 终端输出配置
[tool.ty.terminal]
# 输出格式：full, concise, gitlab, github
output-format = "full"

# 将警告视为错误
error-on-warning = false

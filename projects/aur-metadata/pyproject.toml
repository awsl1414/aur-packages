[project]
name = "aur-metadata"
version = "0.1.0"
description = "AUR packages metadata service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=4.0.0a6",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "tortoise-orm>=1.1.7",
    "zstandard>=0.25.0",
]

[project.scripts]
aur-metadata = "aur_metadata.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试中的 async 测试函数无需显式标记
asyncio_mode = "auto"

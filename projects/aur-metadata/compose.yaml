services:
  aur-metadata:
    # 构建上下文为 monorepo 仓库根（Dockerfile 内按 workspace 布局拷贝）
    build:
      context: ../..
      dockerfile: projects/aur-metadata/Dockerfile
    image: aur-metadata:latest
    container_name: aur-metadata
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 覆盖镜像内配置以调整监听地址/数据库路径等（无需重新构建）
      - ./configs/config.docker.toml:/app/configs/config.docker.toml:ro
      - ./data:/app/data # 持久化 SQLite 数据库
    dns:
      - "119.29.29.29" # 必须，否则 qq 解析不到内容



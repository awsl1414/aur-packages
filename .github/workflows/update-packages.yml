name: Update Packages

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: true

env:
  GIT_AUTHOR_NAME: "github-actions[bot]"
  GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
  AUR_USERNAME: "github-actions[bot]"
  AUR_EMAIL: "github-actions[bot]@users.noreply.github.com"

jobs:
  update:
    name: Detect updates
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            projects/*/pyproject.toml

      - name: Sync dependencies and update packages
        env:
          # GitHub 来源包在 metadata 不可用时回退到 api.github.com；
          # 匿名仅 60 次/时，三个包同时回退就可能耗尽，注入 token 提到 5000 次/时
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --package aur-auto-update
          uv run --package aur-auto-update aur-auto-update

      # 两类包需要推送 AUR：
      # 1) updater 改了 PKGBUILD（版本或校验和变化）
      # 2) AUR 上还不存在该包——新加入仓库的包没有版本变化，git diff 抓不到，
      #    必须查 AUR 才能识别；漏判会让新包一直停留在本地仓库
      # AUR 查询失败即终止：查询故障无法区分「包存在」与「不存在」，继续跑会
      # 要么漏推、要么误推，两种都掩盖真实问题
      - name: Detect packages to push
        id: detect
        run: |
          CHANGED=()
          for pkg_path in packages/*/; do
            [ -d "$pkg_path" ] || continue
            pkg_name=$(basename "$pkg_path")
            reason=""
            if ! git diff --quiet -- "$pkg_path/PKGBUILD"; then
              reason="PKGBUILD 已更新"
            else
              response=$(curl -fsS --max-time 20 \
                "https://aur.archlinux.org/rpc/v5/info?arg[]=${pkg_name}")
              count=$(echo "$response" | jq -er '.resultcount')
              if [ -z "$count" ]; then
                echo "::error::查询 ${pkg_name} 的 AUR 状态失败：${response}"
                exit 1
              fi
              if [ "$count" -eq 0 ]; then
                reason="AUR 上尚不存在，首次推送"
              fi
            fi
            if [ -n "$reason" ]; then
              echo "  $pkg_name —— $reason"
              CHANGED+=("$pkg_name")
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "packages=[]" >> "$GITHUB_OUTPUT"
          else
            packages=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -s -c .)
            echo "packages=$packages" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload updated PKGBUILDs
        if: steps.detect.outputs.packages != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: pkgbuilds
          path: packages/

  generate-srcinfo:
    name: .SRCINFO (${{ matrix.package }})
    needs: update
    if: needs.update.outputs.changed_packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.update.outputs.changed_packages) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download updated PKGBUILDs
        uses: actions/download-artifact@v8
        with:
          name: pkgbuilds
          path: packages/

      - name: Generate .SRCINFO
        uses: awsl1414/archlinux-package-action@main
        with:
          path: packages/${{ matrix.package }}
          flags: ''
          namcap: false
          srcinfo: true

      - name: Prepare .SRCINFO artifact
        run: |
          mkdir -p "tmp/artifact/${{ matrix.package }}"
          cp "packages/${{ matrix.package }}/.SRCINFO" "tmp/artifact/${{ matrix.package }}/"

      - name: Upload .SRCINFO
        uses: actions/upload-artifact@v7
        with:
          name: srcinfo-${{ matrix.package }}
          path: tmp/artifact/
          include-hidden-files: true

  commit:
    name: Commit and push
    needs: [update, generate-srcinfo]
    if: needs.update.outputs.changed_packages != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download updated PKGBUILDs
        uses: actions/download-artifact@v8
        with:
          name: pkgbuilds
          path: packages/

      - name: Download .SRCINFO files
        uses: actions/download-artifact@v8
        with:
          pattern: srcinfo-*
          merge-multiple: true
          path: packages/

      - name: Commit and push
        run: |
          git config user.name "${{ env.GIT_AUTHOR_NAME }}"
          git config user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          git config core.hooksPath .githooks

          git add packages/

          # 仅「AUR 上尚不存在」的包不会产生任何文件改动（PKGBUILD 与
          # .SRCINFO 都已是仓库中的现状），此时无内容可提交，直接跳过——
          # 首次推送到 AUR 由后面的 push-to-aur 完成，不依赖这次提交
          if git diff --cached --quiet; then
            echo "无文件改动，跳过提交（首次推送的包在 push-to-aur 中处理）"
            exit 0
          fi

          changed='${{ needs.update.outputs.changed_packages }}'
          count=$(echo "$changed" | jq 'length')
          git commit -m "chore: update AUR packages" \
                     -m "Updated ${count} package(s)" \
                     -m "Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push

  push-to-aur:
    name: Push ${{ matrix.package }} to AUR
    needs: [update, commit]
    if: needs.update.outputs.changed_packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.update.outputs.changed_packages) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Detect package assets
        id: assets
        run: |
          assets=""
          for file in packages/${{ matrix.package }}/* packages/${{ matrix.package }}/.*; do
            basename=$(basename "$file")
            [ "$basename" = "PKGBUILD" ] && continue
            [ "$basename" = ".SRCINFO" ] && continue
            [ "$basename" = ".gitignore" ] && continue
            [ "$basename" = "." ] && continue
            [ "$basename" = ".." ] && continue
            [ -f "$file" ] || continue
            assets="${assets}${file}"$'\n'
          done
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$assets" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.package }} to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: packages/${{ matrix.package }}/PKGBUILD
          assets: ${{ steps.assets.outputs.files }}
          commit_username: ${{ env.AUR_USERNAME }}
          commit_email: ${{ env.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Automatic update from GitHub Actions
          ssh_keyscan_types: rsa,ecdsa,ed25519

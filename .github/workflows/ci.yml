name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Type check / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            projects/*/pyproject.toml

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Ruff check
        run: uv run ruff check projects/

      - name: Type check (ty)
        run: uv run ty check projects/

      - name: Test aur-auto-update
        working-directory: projects/aur-auto-update
        run: uv run pytest

      - name: Test aur-metadata
        working-directory: projects/aur-metadata
        run: uv run pytest

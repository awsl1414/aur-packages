name: Publish aur-metadata image

on:
  push:
    # dev 是本仓库的默认分支与主开发线（定时采集、CI 均在此跑），镜像在 dev
    # 上构建，改完即可拉取验证；main 仅由 dev 合并而来，不单独触发
    branches:
      - dev
    paths:
      - projects/aur-metadata/**
      - uv.lock
      - pyproject.toml
      - .github/workflows/publish-metadata-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-metadata-image
  cancel-in-progress: false

env:
  IMAGE_NAME: aur-metadata
  # 写死命名空间而不是引用 secret：未配置时 images 会退化成 "/aur-metadata"
  # 这种无效名，构建才报错；用户名不是密钥，token 才需要
  DOCKERHUB_OWNER: awsl1414

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            projects/*/pyproject.toml

      - name: Sync dependencies
        run: uv sync --package aur-metadata

      - name: Test aur-metadata
        working-directory: projects/aur-metadata
        run: uv run pytest

  build:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read package version
        id: version
        run: |
          version=$(grep -m1 '^version' projects/aur-metadata/pyproject.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::projects/aur-metadata/pyproject.toml 未解析到 version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      # 版本号未升时（自上次发布以来只改了别的东西），远端已有该版本的镜像，
      # 说明这次是开发中的中间状态：只打 dev 标签供验证，不覆盖 v<version>
      # 与 latest，避免把未发布的代码变成用户默认拉到的版本
      - name: Check if version already published
        id: release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # 只把 200 视为已发布；网络错误或非 200 一律按未发布处理，
          # 宁可重复发布（幂等）也不要漏发
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_OWNER}/${IMAGE_NAME}/tags/${tag}/")
          if [ "$code" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "dev=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag 已发布，本轮只推 dev 标签供验证"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "dev=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag 尚未发布，本轮将发布正式版本"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_OWNER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_OWNER }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # 单一 step 内按 release 取值分支：tag 沿用仓库既有约定 v<version>
          # （历史镜像为 v1.0.0~v1.0.2），version 字段本身不带 v，显式加前缀。
          # dev 分支构建只在版本号未发布时出现，此时用 dev 标签供验证，
          # 避免中间状态覆盖 latest
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ steps.release.outputs.publish }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish }}
            type=raw,value=dev,enable=${{ steps.release.outputs.dev }}
            type=sha,format=short,prefix=dev-,enable=${{ steps.release.outputs.dev }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/aur-metadata/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
